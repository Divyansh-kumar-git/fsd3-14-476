<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Cafe Serenade</title>
    <style>
        /* CSS RESET & GENERAL STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            line-height: 1.6;
            color: #333;
            background-color: #fcfbfa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* NAVIGATION BAR */
        header {
            background-color: #2c1d11;
            color: #fff;
            padding: 1rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #d4a373;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: #f4e9dc;
            transition: color 0.3s;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #d4a373;
        }

        /* HERO BANNER FOR INNER PAGES */
        .page-banner {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=1350&q=80') center/cover no-repeat;
            height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }

        .page-banner h1 {
            font-size: 2.5rem;
            color: #faedcd;
        }

        /* ENQUIRY FORM CONTAINER */
        .form-container {
            max-width: 700px;
            width: 90%;
            margin: 40px auto;
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            flex: 1;
        }

        .form-container h2 {
            color: #2c1d11;
            margin-bottom: 10px;
            text-align: center;
        }

        .form-container p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c1d11;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: #d4a373;
        }

        .submit-btn {
            width: 100%;
            background-color: #2c1d11;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background-color: #d4a373;
        }

        /* FOOTER */
        footer {
            background-color: #2c1d11;
            color: #f4e9dc;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
            }

            nav ul {
                margin-top: 15px;
            }

            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="logo">☕ Cafe Serenade</div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/about">About Us</a></li>
                <li><a href="/enquiry" class="active">Enquiry</a></li>
            </ul>
        </nav>
    </header>

    <!-- Page Banner -->
    <section class="page-banner">
        <h1>Get In Touch</h1>
    </section>

    <!-- Form Section -->
    <main class="form-container">
        <h2>Send Us An Enquiry</h2>
        <p>Have questions about party bookings, catering, or bulk coffee bean orders? Fill out the form below!</p>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
            </div>

            <div class="form-group">
                <label for="type">Enquiry Type</label>
                <select id="type" name="type" required>
                    <option value="">Select an option...</option>
                    <option value="general">General Question</option>
                    <option value="table">Table Reservation</option>
                    <option value="catering">Event Catering</option>
                    <option value="feedback">Feedback</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your enquiry here..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Enquiry</button>
        </form>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Cafe Serenade. All Rights Reserved.</p>
        <p>123 Coffee Street, Flavor Town | Open Daily: 6:00 AM - 8:00 PM</p>
    </footer>

</body>
</html>
